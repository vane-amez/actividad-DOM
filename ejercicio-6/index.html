<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

    <div class="container">
        <div class="container-card">
            <div class="card">
                <h1>Calculadora de IMC</h1>
                <div>
                    <label for="peso">Peso en kilogramos:</label>
                    <input id="peso" type="number" name="peso" placeholder="60 kg" step="any">
                </div>

                <div>
                    <label for="estatura">Estatura en metros:</label>
                    <input id="estatura" type="number" name="estatura" placeholder="1.55 m" step="any">
                </div>

                <button id="boton" type="button">Calcular IMC</button>
                <p id="resultado"></p>
            </div>
        </div>
    </div>

</body>

<script src="./js/app.js"></script>

</html>
