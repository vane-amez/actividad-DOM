<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9</title>
    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

    <div class="container">
        <div class="container-card">
            <div class="card">
                <h1>Tarjeta de perfil</h1>

                <form action="" id="formulario">
                    <label for="name">Nombre:</label>
                    <input id="name" type="text" name="name" placeholder="Escribe tu nombre:">

                    <label for="profesion">Profesión:</label>
                    <input id="profesion" type="text" name="profesion" placeholder="Escribe tu profesión:">

                    <label for="foto">URL foto:</label>
                    <input id="foto" type="text" name="foto" placeholder="URL de la foto:">

                    <button type="submit">Enviar datos</button>

                </form>
            </div>
        </div>
    </div>

</body>

<script src="./js/js.js"></script>

</html>
