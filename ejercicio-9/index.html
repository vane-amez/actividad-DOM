<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

    <div class="container">
        <div class="container-card">
            <div class="card">
                <h1>Tarjeta de perfil</h1>

                <form action="" id="formulario">
                    <label for="name">Nombre:</label>
                    <input id="nombre" type="text" name="name" placeholder="Escribe tu nombre:">

                    <label for="profesion">Profesión:</label>
                    <input id="profesion" type="text" name="profesion" placeholder="Escribe tu profesión:">

                    <label for="foto">URL foto:</label>
                    <input id="foto" type="text" name="foto" placeholder="URL de la foto:">

                </form>
            </div>
        </div>
    </div>

    <div class="card text-center">
        <div class="card-body">
            <img id="tarjetafoto" src="https://i.pinimg.com/236x/d1/e3/d2/d1e3d2a12bc3d0221898c4391dffcfff.jpg" alt="Foto de perfil" class="rounded-circle mb-3" width="120" height="120" style="object-fit: cover;">
            <h2 id="tarjetanombre">Tu nombre:</h2>
            <p id="tarjetaprofesion">Tu profesión:</p>
        </div>

    </div>

</body>

<script src="./js/js.js"></script>

</html>
