<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14</title>
    <link rel="stylesheet" href="./css/estilos.css">
</head>

<body>

    <div class="container">
        <div class="container-card">
            <div class="card">
                <h1>Calculadora de presupuesto</h1>
                <div>
                    <label for="inicial">Presupuesto inicial:</label>
                    <input id="inicial" type="number" name="inicial">
                </div>
                <div>
                    <label for="nombre-gasto">Nombre del gasto:</label>
                    <input id="nombre-gasto" type="text" name="nombre-gasto">
                </div>
                <div>
                    <label for="gasto">Valor del gasto:</label>
                    <input id="gasto" type="number" name="gasto">
                </div>

                <button id="boton" type="button">Agregar gasto</button>
                <ul id="lista"></ul>
                <p id="aviso"></p>

                <div id="resumen">
                    <p>Presupuesto inicial: <span id="resumen-inicial">0</span></p>
                    <p>Total gastado: <span id="resumen-gastado">0</span></p>
                    <p>Dinero restante: <span id="resumen-restante">0</span></p>
                </div>
                <p id="superado"></p>
            </div>
        </div>
    </div>

</body>

<script src="./js/js.js"></script>

</html>
